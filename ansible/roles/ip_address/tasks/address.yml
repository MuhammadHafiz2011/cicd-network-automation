---

# ===========================
# IP ADDRESS CONFIGURATION
# ===========================

# -----------------------------------
# REFRESH CURRENT IP CONFIGURATION
# -----------------------------------
# Mengambil ulang konfigurasi IP setelah proses Add/Update agar data yang digunakan tetap terbaru.

- name: Refresh current IP configuration
  community.routeros.command:
    commands:
      - /ip address export terse
  register: current_ip
  changed_when: false

# ---------------------------
# ADD OR UPDATE IP ADDRESS
# ---------------------------
# Menambahkan IP baru atau memperbarui interface jika konfigurasi berbeda.

- name: Add or Update IP address
  community.routeros.command:
    commands:
      - >
        # Menyimpan parameter konfigurasi ke variabel lokal RouterOS.
        :local ipAddr "{{ item.ip_address }}";
        :local iface "{{ item.interface }}";

        # Mencari IP Address yang sudah ada pada MikroTik.
        :local existing [/ip address find where address=$ipAddr];

        :if ([:len $existing] = 0) do={

          /ip address add \
          address=$ipAddr \
          interface=$iface;

        } else={
          # Memperbarui interface jika IP sudah ada tetapi berbeda.
          :if (
            [/ip address get $existing interface] != $iface
          ) do={

            /ip address set \
            $existing \
            interface=$iface;

          }

        }

  loop: >-
    {{
      mikrotik_interfaces
      | selectattr('ip_address', 'defined')
      | list
    }}

  loop_control:
    label: "{{ item.interface }} -> {{ item.ip_address }}"

# -----------------------------------
# REFRESH CURRENT IP CONFIGURATION
# -----------------------------------
# Mengambil ulang konfigurasi IP setelah proses Add/Update agar data yang digunakan tetap terbaru.

- name: Refresh current IP configuration
  community.routeros.command:
    commands:
      - /ip address export terse
  register: current_ip
  changed_when: false

# -------------------------
# BUILD EXISTING IP LIST
# -------------------------
# Menyusun daftar IP Address yang saat ini terdapat pada MikroTik.

- name: Build existing IP list
  set_fact:
    existing_ips: >-
      {{
        current_ip.stdout | join('\n')
        | regex_findall('address=([0-9./]+)')
      }}

# -----------------------------------------------------
# BUILD DESIRED IP LIST
# -----------------------------------------------------
# Menyusun daftar IP Address yang diinginkan berdasarkan inventory.

- name: Build desired IP list
  set_fact:
    desired_ips: >-
      {{
        mikrotik_interfaces
        | selectattr('ip_address', 'defined')
        | map(attribute='ip_address')
        | list
      }}

# ---------------------------
# REMOVE UNUSED IP ADDRESS
# ---------------------------
# Menghapus IP Address yang tidak terdapat dalam konfigurasi inventory.

- name: Remove unused IP address
  community.routeros.command:
    commands:
      - /ip address remove [find address="{{ item }}"]

  loop: "{{ existing_ips | difference(desired_ips) }}"

  when:
    - (existing_ips | difference(desired_ips)) | length > 0

  loop_control:
    label: "Removing {{ item }}"
