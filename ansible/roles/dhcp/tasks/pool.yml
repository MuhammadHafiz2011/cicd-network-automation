---

# ==================================
# DHCP POOL CONFIGURATION
# ==================================

# --------------------------------------
# ADD OR UPDATE DHCP POOL
# --------------------------------------
# Menambahkan DHCP Pool baru atau memperbarui rentang IP apabila DHCP Pool dengan nama yang sama sudah ada.

- name: Add or Update DHCP pool
  community.routeros.command:
    commands:
      - >
        # Menyimpan nama dan rentang IP dari konfigurasi.
        :local pName "{{ item.dhcp_pool }}";
        :local pRange "{{ item.dhcp_range }}";
        :local existing [:len [/ip pool find name=$pName]];

        # Menambahkan DHCP Pool jika belum ditemukan.
        :if ($existing = 0) do={
            /ip pool add name=$pName ranges=$pRange;
        } else={
            # Memperbarui rentang IP jika DHCP Pool sudah ada tetapi berbeda.
            :if ([/ip pool get [find name=$pName] ranges] != $pRange) do={
                /ip pool set [find name=$pName] ranges=$pRange;
            }
        }
  loop: "{{ mikrotik_dhcp }}"
  loop_control:
    label: "Syncing Pool: {{ item.dhcp_pool }}"

# --------------------------------------
# REFRESH DHCP STATE
# --------------------------------------
# Mengambil ulang konfigurasi DHCP Pool setelah proses Add/Update agar data tetap terbaru.

- name: Refresh DHCP pools state
  community.routeros.command:
    commands:
      - /ip pool print detail without-paging
  register: updated_pool
  changed_when: false

# --------------------------------------
# BUILD EXISTING POOL LIST
# --------------------------------------
# Menyusun daftar DHCP Pool yang saat ini terdapat pada MikroTik.

- name: Build existing pool list
  set_fact:
    existing_pools: >-
      {{
        updated_pool.stdout[0]
        | regex_findall('name=([^ ]+)')
        | map('regex_replace', '"', '')
        | map('trim')
        | list
      }}

# --------------------------------------
# REMOVE UNUSED DHCP POOLS
# --------------------------------------
# Menghapus DHCP Pool yang tidak lagi terdapat dalam konfigurasi inventory.

- name: Remove unused DHCP pools
  community.routeros.command:
    commands:
      - /ip pool remove [find name="{{ item }}"]
  loop: "{{ existing_pools }}"
  when: item not in (mikrotik_dhcp | map(attribute='dhcp_pool') | list)
