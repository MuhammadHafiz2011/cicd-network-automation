---
# ==================================================
# COLLECT CURRENT DEVICE STATE
# Mengambil seluruh konfigurasi aktual dari MikroTik.
# Konfigurasi ini akan digunakan sebagai data pembanding
# pada tahap verifikasi setelah proses deployment selesai.
# ==================================================

# ---------------------------------------
# GET CURRENT IP ADDRESS CONFIGURATION
# ---------------------------------------

- name: Get current IP address configuration
  community.routeros.command:
    commands:
      - /ip address print detail without-paging
  register: current_ip
  changed_when: false

# -----------------------------------------
# GET CURRENT DHCP NETWORK CONFIGURATION
# -----------------------------------------

- name: Get current DHCP network configuration
  community.routeros.command:
    commands:
      - /ip dhcp-server network print detail without-paging
  register: current_network
  changed_when: false

# --------------------------------------
# GET CURRENT DHCP POOL CONFIGURATION
# --------------------------------------

- name: Get current DHCP pool configuration
  community.routeros.command:
    commands:
      - /ip pool print detail without-paging
  register: current_pool
  changed_when: false

# ----------------------------------------
# GET CURRENT DHCP SERVER CONFIGURATION
# ----------------------------------------

- name: Get current DHCP server configuration
  community.routeros.command:
    commands:
      - /ip dhcp-server print detail without-paging
  register: current_dhcp
  changed_when: false

# ---------------------------------------
# GET CURRENT DHCP LEASE CONFIGURATION
# ---------------------------------------

- name: Get current DHCP lease configuration
  community.routeros.command:
    commands:
      - /ip dhcp-server lease print detail without-paging
  register: current_lease
  changed_when: false

# --------------------------------
# GET CURRENT NAT CONFIGURATION
# --------------------------------

- name: Get current NAT configuration
  community.routeros.command:
    commands:
      - /ip firewall nat print detail without-paging
  register: current_nat
  changed_when: false

# --------------------------------
# GET CURRENT DNS CONFIGURATION
# --------------------------------

- name: Get current DNS configuration
  community.routeros.command:
    commands:
      - /ip dns print
  register: current_dns
  changed_when: false

# -------------------------
# GET CURRENT DNS STATIC
# -------------------------

- name: Get current DNS Static
  community.routeros.command:
    commands:
      - /ip dns static print detail without-paging
  register: current_dns_static
  changed_when: false


# =====================================================
# VERIFY DEPLOYED CONFIGURATION
# Membandingkan konfigurasi yang telah dideploy dengan
# kondisi aktual pada MikroTik.
# Jika ditemukan perbedaan, proses deployment akan
# dihentikan melalui mekanisme assert.
# =====================================================

# ------------------------------
# VERIFY INTERFACE IP ADDRESS
# ------------------------------

- name: Verify interface IP configuration
  assert:
    that:
      - >
        current_ip.stdout[0]
        is search(
          'address=' ~ item.ip_address
        )

      - >
        current_ip.stdout[0]
        is search(
          'interface=' ~ item.interface ~ '(\\s|$)'
        )

    fail_msg: >
      [VERIFY FAILURE]
      IP {{ item.ip_address }}
      not found on interface {{ item.interface }}.
      Configuration drift detected after deployment.

    success_msg: >
      [VERIFY SUCCESS]
      IP {{ item.ip_address }}
      verified on interface {{ item.interface }}.

  loop: "{{ mikrotik_interfaces }}"
  loop_control:
    label: "{{ item.interface }}"

  when: item.ip_address is defined

# ----------------------
# VERIFY DHCP NETWORK
# ----------------------

- name: Verify DHCP network configuration
  assert:
    that:
      - >
        current_network.stdout[0]
        is search(
          'address=' ~ item.dhcp_network
        )

      - >
        current_network.stdout[0]
        is search(
          'gateway=' ~ item.dhcp_gateway
        )

      - >
        current_network.stdout[0]
        is search(
          'dns-server=' ~ item.dns_server
        )

    fail_msg: >
      [VERIFY FAILURE]
      DHCP Network {{ item.dhcp_network }}
      mismatch detected.

    success_msg: >
      [VERIFY SUCCESS]
      DHCP Network {{ item.dhcp_network }}
      verified.

  loop: "{{ mikrotik_dhcp }}"
  loop_control:
    label: "{{ item.dhcp_network }}"

# -------------------
# VERIFY DHCP POOL
# -------------------

- name: Verify DHCP pool configuration
  assert:
    that:
      - >
        current_pool.stdout[0]
        is search(
          'name="' ~ item.dhcp_pool ~ '"'
        )

      - >
        current_pool.stdout[0]
        is search(
          'ranges=' ~ item.dhcp_range
        )

    fail_msg: >
      [VERIFY FAILURE]
      DHCP pool {{ item.dhcp_pool }}
      mismatch detected.

    success_msg: >
      [VERIFY SUCCESS]
      DHCP pool {{ item.dhcp_pool }}
      verified.

  loop: "{{ mikrotik_dhcp }}"
  loop_control:
    label: "{{ item.dhcp_pool }}"

# ---------------------
# VERIFY DHCP SERVER
# ---------------------
- name: Verify DHCP server configuration
  assert:
    that:
      - >
        current_dhcp.stdout[0]
        is search(
          'name="' ~ item.dhcp_name ~ '"'
        )

      - >
        current_dhcp.stdout[0]
        is search(
          'interface=' ~ item.interface
        )

      - >
        current_dhcp.stdout[0]
        is search(
          'address-pool=' ~ item.dhcp_pool
        )

    fail_msg: >
      [VERIFY FAILURE]
      DHCP server {{ item.dhcp_name }}
      not found or mismatched.

    success_msg: >
      [VERIFY SUCCESS]
      DHCP server {{ item.dhcp_name }}
      verified.

  loop: "{{ mikrotik_dhcp }}"
  loop_control:
    label: "{{ item.dhcp_name }}"

# --------------------
# VERIFY DHCP LEASE
# --------------------

- name: Verify DHCP lease configuration
  assert:
    that:
      - >
          current_lease.stdout[0]
          is search(
            'address=' ~ item.ip_address
          )

      - >
          current_lease.stdout[0]
          is search(
            'mac-address=' ~ item.mac_address
          )

      - >
          current_lease.stdout[0]
          is search(
            'server=' ~ item.dhcp_server
          )

    fail_msg: >
      [VERIFY FAILURE]
      DHCP Lease {{ item.comment }}
      not found or mismatched.

    success_msg: >
      [VERIFY SUCCESS]
      DHCP Lease {{ item.comment }}
      verified.

  loop: "{{ mikrotik_dhcp_lease }}"
  loop_control:
    label: "{{ item.comment }}"

# ----------------
# VERIFY SRCNAT
# ----------------

- name: Verify SRCNAT configuration
  assert:
    that:
      - >
        current_nat.stdout[0]
        is search(
          'chain=srcnat'
        )

      - >
        current_nat.stdout[0]
        is search(
          'out-interface=' ~ item.out_interface
        )

      - >
        current_nat.stdout[0]
        is search(
          'action=' ~ item.action
        )

    fail_msg: >
      [VERIFY FAILURE]
      SRCNAT {{ item.out_interface }}
      not found or mismatched.

    success_msg: >
      [VERIFY SUCCESS]
      SRCNAT {{ item.out_interface }}
      verified.

  loop: >-
    {{
      mikrotik_nat
      | selectattr('chain', 'equalto', 'srcnat')
      | list
    }}

  loop_control:
    label: "{{ item.out_interface }}"

# -------------------------
# GET CURRENT DSTNAT RULE
# Mengambil rule DSTNAT berdasarkan dst-port agar
# setiap rule diverifikasi secara independen dan
# menghindari false positive pada beberapa rule DSTNAT.
# -------------------------

- name: Get current DSTNAT rule
  community.routeros.command:
    commands:
      - /ip firewall nat print detail where dst-port="{{ item.dst_port }}"
  register: current_dstnat
  changed_when: false

  loop: >-
    {{
      mikrotik_nat
      | selectattr('chain', 'equalto', 'dstnat')
      | list
    }}

  loop_control:
    label: "{{ item.dst_port }}"

# ----------------
# VERIFY DSTNAT
# ----------------

- name: Verify DSTNAT configuration
  assert:
    that:

      - >
          (
            current_dstnat.results
            | selectattr('item.dst_port', 'equalto', item.dst_port)
            | first
          ).stdout[0]
          is search(
            'protocol=' ~ item.protocol
          )

      - >
          (
            current_dstnat.results
            | selectattr('item.dst_port', 'equalto', item.dst_port)
            | first
          ).stdout[0]
          is search(
            'dst-port=' ~ (item.dst_port | string)
          )

      - >
          (
            current_dstnat.results
            | selectattr('item.dst_port', 'equalto', item.dst_port)
            | first
          ).stdout[0]
          is search(
            'in-interface=' ~ item.in_interface
          )

      - >
          (
            current_dstnat.results
            | selectattr('item.dst_port', 'equalto', item.dst_port)
            | first
          ).stdout[0]
          is search(
            'to-addresses=' ~ item.to_address
          )

      - >
          (
            current_dstnat.results
            | selectattr('item.dst_port', 'equalto', item.dst_port)
            | first
          ).stdout[0]
          is search(
            'to-ports=' ~ (item.to_port | string)
          )

      - >
          (
            current_dstnat.results
            | selectattr('item.dst_port', 'equalto', item.dst_port)
            | first
          ).stdout[0]
          is search(
            'action=' ~ item.action
          )

    fail_msg: >-
      [VERIFY FAILURE]
      DSTNAT {{ item.dst_port }}
      not found or mismatched

    success_msg: >-
      [VERIFY SUCCESS]
      DSTNAT {{ item.dst_port }}
      verified.

  loop: >-
    {{
      mikrotik_nat
      | selectattr('chain', 'equalto', 'dstnat')
      | list
    }}

  loop_control:
    label: "{{ item.dst_port }}"

# -------------------------------------
# VERIFY DNS CONFIGURATION
# -------------------------------------

- name: Verify DNS configuration
  assert:
    that:
      - >
          current_dns.stdout[0]
          is search(
            'servers:\\s*' ~
            (mikrotik_dns.servers | join(','))
          )

      - >
          current_dns.stdout[0]
          is search(
            'allow-remote-requests:\\s*' ~
            (
              'yes'
              if mikrotik_dns.allow_remote_requests
              else 'no'
            )
          )

    fail_msg: >
      [VERIFY FAILURE]
      DNS configuration not found or mismatched.

    success_msg: >
      [VERIFY SUCCESS]
      DNS configuration verified.

# --------------------
# VERIFY DNS STATIC
# --------------------

- name: Verify DNS Static
  assert:
    that:
      - >
        current_dns_static.stdout[0]
        is search(
          'name="' ~ item.name ~ '"'
        )

      - >
        current_dns_static.stdout[0]
        is search(
          'address=' ~ item.address
        )

    fail_msg: |
      [VERIFY FAILURE]
      DNS Static '{{ item.name }}' does not match the expected configuration.
    success_msg: |
      [VERIFY SUCCESS]
      DNS Static '{{ item.name }}' verified.

  loop: "{{ mikrotik_dns_static | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

# ----------------------------
# FINAL VERIFICATION RESULT 
# ----------------------------

- name: Verification success
  debug:
    msg: "Deployment verification completed successfully"
