[defaults]

# ==========================
# Inventory Configuration
# ==========================
# Menentukan file inventory default yang akan digunakan
# oleh seluruh playbook Ansible.
inventory = inventories/production/hosts.ini

# =====================
# Role Configuration
# =====================
# Menentukan lokasi direktori role Ansible.
roles_path = roles

# ======================
# Connection Behavior
# ======================
# Menonaktifkan verifikasi host key agar deployment
# otomatis tidak memerlukan konfirmasi manual.
host_key_checking = False

# Waktu tunggu koneksi SSH (dalam detik).
timeout = 30

# =============
# Execution
# =============

# Menentukan interpreter Python secara otomatis.
interpreter_python = auto_silent

# Menampilkan hasil eksekusi dalam format YAML.
stdout_callback = yaml
